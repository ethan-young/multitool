url: https://ethan-young.github.io/multitool/

home:
  title: An R package for designing and running multiverse analysis
  description: Create, validate, visualize, and run multiverse data analysis pipelines.

template:
  bootstrap: 5
  theme: arrow-light
  navbar:
    type: light
  bslib:
    base_font: {google: "Lato"}
    code_font: {google: "Fira Code"}
    font_scale: 1.1
    line-height-base: "1.5"
    headings-font-weight: "bold"
    bg: "#fff"
    code-bg: "#f8f8f8"
    pre-bg: "#f8f8f8"
    pre-border: "#f8f8f8"
    fg: "#000"
    secondary: "#f8f8f8"
    light: "white"
  includes:
    in_header: |
      <script defer data-domain="ethan-young.github.io/multitool" src="https://plausible.io/js/script.js"></script>

articles:
- title: Get started
  navbar: ~
  contents:
  - create-your-blueprint
  - validate-your-blueprint
  - run-your-pipeline
  - multitool-nomenclature

reference:
- title: Creating a Pipeline
  desc: >
    Add your analysis pipeline steps
  contents:
  - add_subgroups
  - add_filters
  - add_variables
  - add_model
  - add_model_descriptives
  - add_preprocess
  - add_postprocess
  - add_parameter_keys
  - expand_decisions

- title: View, Check, and Test
  desc: >
    View metadata, check the code, and test the pipeline
  contents:
  - visualize_pipeline
  - create_blueprint_graph
  - detect_multiverse_n
  - detect_n_subgroups
  - detect_n_filters
  - detect_n_variables
  - detect_n_models
  - summarize_filter_ns
  - show_code

- title: Run your Pipeline
  desc: >
    Execute the whole pipeline and all alternatives
  contents:
  - analyze_grid
  - analyze_grid_parallel

- title: Unpack Results
  desc: >
    Unpack your results for viewing, plotting, and understanding
  contents:
  - unpack_specs
  - unpack_results
  - unpack_postprocess
  - unpack_model_parameters
  - unpack_model_performance
  - unpack_model_warnings
  - unpack_model_messages
  - condense
  - organize

- title: Assess Decision Sensitivity/Robustness
  desc: >
    Evaluate the robustness of a model output over the whole decision space, by
    decision alternatives, or assess the impact of making specific decisions.
  contents:
  - assess_robustness

- title: Superseded
  desc: >
    Functions that have been replaced by new approaches that are better. These
    functions still work and will stick around.
  contents:
  - has_lifecycle("superseded")

- title: Deprecated
  desc: >
    Functions that are no longer supported and will be removed in a future version.
  contents:
  - has_lifecycle("deprecated")
